<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com;">
  <title>LibrasTech — Autenticação</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="login-container">

  <div class="login-card">
    <div class="login-brand-icon">
      <i class="fa-solid fa-hands-asl-interpreting"></i>
    </div>
    
    <h3 class="text-center fw-bold text-dark mb-1">Bem-vindo ao LibrasTech</h3>
    <p class="text-center text-muted fs-6 mb-4">Acesse o painel de desenvolvimento</p>

    <div id="alertaErro" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

    <form id="formLogin" novalidate>
      <div class="mb-3">
        <label for="inputEmail" class="form-label fw-semibold">E-mail</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fa-regular fa-envelope text-muted"></i></span>
          <input type="email" class="form-control" id="inputEmail" placeholder="desenvolvedor@librastech.com" required>
        </div>
      </div>

      <div class="mb-4">
        <label for="inputSenha" class="form-label fw-semibold">Senha</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
          <input type="password" class="form-control" id="inputSenha" placeholder="••••••••" required>
          <button class="btn btn-outline-secondary" type="button" id="btnToggleSenha">
            <i class="fa-regular fa-eye" id="iconeOlho"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btnEntrar" class="btn btn-lt-primary w-100 py-2">
        <span id="btnText">Entrar</span>
        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
      </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center text-muted small">
      Plataforma de Desenvolvimento LibrasTech &copy; 2026
    </div>
  </div>

  <script src="frmLogin.js"></script>
</body>
</html>
